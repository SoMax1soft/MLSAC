# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                           MLSAC Configuration                                 ║
# ║                    ML Anti-Cheat with AI Detection                            ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# What runs at all is decided in modules.yml. Per-module settings live in modules/<name>.yml.
# This file holds the core: language, API credentials, server identity and platform settings.
#
# Schema marker — when a user's config has a different value the plugin runs a one-time wipe
# migration (preserving detection.api-key, detection.endpoint, remote-config.preset,
# penalties.actions). Do not edit.
_schema-version: 'b54'

# ┌───────────────────────────────────────────────────────────────────────────────┐
# │                            GENERAL SETTINGS                                   │
# └───────────────────────────────────────────────────────────────────────────────┘

# Enable debug mode for additional console output
debug: false

# Language for plugin messages: "ru" (Russian), "en" (English), "vi" (Vietnamese)
language: "ru"

# Directory for saving data files
outputDirectory: "data"

# Update notifications: the plugin checks the MLSAC backend every 5 minutes and notifies admins
# when a new version is available. Switch it off in modules.yml -> updates

# ┌───────────────────────────────────────────────────────────────────────────────┐
# │                            DETECTION SETTINGS                                 │
# └───────────────────────────────────────────────────────────────────────────────┘
detection:
  # Whether detection runs at all is set in modules.yml -> detection
  #
  # AI server endpoint
  endpoint: "https://api.mlsac.net"

  # Fallback endpoint, used only when the one above cannot be reached at all — a connection
  # timeout, a refused connection or a DNS failure. An HTTP error (bad API key, server error) is
  # an answer, not an outage, so it never triggers the switch.
  #
  # On the next reconnect the primary is tried first again, so a temporary outage does not leave
  # the server pinned to the reserve forever. Leave empty to disable failover.
  reserve-endpoint: "https://ruapi.mlsac.net"
  
  # API key for authentication
  # To buy API key visit https://mlsac.net
  # Free trial is also available in dashboard
  api-key: "your-api-key"

# ┌───────────────────────────────────────────────────────────────────────────────┐
# │                              PUNISHMENTS                                      │
# └───────────────────────────────────────────────────────────────────────────────┘
punishments:
  # Punishment commands are built by substituting the player's name into a console command, so a
  # name that is not a plain Java-edition nick (spaces, "*", Geyser/Floodgate prefixes, cracked
  # exotics) can break the command apart and hit the wrong player — "ban Steve Notch reason" bans
  # Steve and passes "Notch" as part of the reason.
  #
  # With this on, such a player is kicked directly through the API instead of running the command:
  # they still get removed, they just do not get banned by a command that cannot be trusted.
  #
  # Set to false to run the command anyway. Only do that if every punishment command in your
  # preset quotes the name itself.
  safe-name-check: true

# ┌───────────────────────────────────────────────────────────────────────────────┐
# │                         REMOTE CONFIGURATION (PRESETS)                        │
# └───────────────────────────────────────────────────────────────────────────────┘
#
# Detection regions, model behaviour, alerts, violation buffers, penalties and the alert
# response / troll system are now configured on https://mlsac.net, not in this file.
#
# How to use it:
#   1. Dashboard -> Настройки (шестерёнка) -> enable "Тестовый режим".
#   2. Dashboard -> Конфиги -> create a preset and give it a name.
#   3. Put that name in `preset` below and run /mlsac reload (or restart).
#
# One API key can hold several presets; `preset` decides which one this server loads. Presets
# are private to your account — a plugin can only ever read presets belonging to the account
# that owns its API key, and it can never write anything back.
#
# If test mode is off, the preset does not exist, or the API is unreachable, the plugin keeps
# using its built-in defaults (identical to what this file used to ship), so nothing breaks.
remote-config:
  # Which dashboard preset to load.
  #   ""      -> AUTO: if your account has exactly one preset on the site, it is applied
  #              automatically (no need to type its name here). With several presets, name one below.
  #   <name>  -> always load exactly this preset.
  #   "none"  -> disable: always use the local config.yml only.
  preset: ""

  # How often to re-check the site for changes, in minutes (1-1440).
  refresh-minutes: 5

# ┌───────────────────────────────────────────────────────────────────────────────┐
# │                            SERVER IDENTITY                                    │
# └───────────────────────────────────────────────────────────────────────────────┘
# Guide https://mlsac.net/wiki
server-identity:
  # Unique server name for cross-server alerts and duplicate-name warnings.
  name: "default"
  # Family/group for inter-server exchange. Only servers with the same family share alerts/actions.
  # Example: set every KingMC mode to "KingMC" so it does not receive events from other networks on the same key.
  family: "default"
  interserver:
    # Adds the server name to inter-server alert/action messages.
    enabled: false
    # Share the /report queue across every server on this account within the same family.
    # When enabled, the suspects "Reports" tab also shows reports from other servers and labels
    # them with the source server; teleport actions stay disabled for reports from another server.
    cross-reports: false
  reporting:
    # Sends alerts above alert-threshold and punish actions to the MLSAC API.
    # Required for dashboard event history, Redis event storage, Discord webhooks, and Telegram webhooks.
    events-enabled: true
    # Minimum model probability for sending alert events to the API.
    alert-threshold: 0.80

# ┌───────────────────────────────────────────────────────────────────────────────┐
# │                            FOLIA SETTINGS                                     │
# └───────────────────────────────────────────────────────────────────────────────┘
#
# These settings are only used when running on a Folia server.
# On Bukkit/Paper/Spigot/kSpigot servers, these settings are ignored.
#

folia:
  # Enable Folia-specific optimizations
  # When disabled, the plugin will use standard Bukkit scheduler even on Folia
  enabled: true # Do not change!
  
  # Thread pool size for async tasks (0 = use Folia default)
  thread-pool-size: 0 # Do not change!
  
  # Entity scheduler settings
  # Use entity-specific schedulers for entity-related tasks
  entity-scheduler: # Do not change!
    enabled: true
  
  # Region scheduler settings
  # Use region-specific schedulers for location-based tasks
  region-scheduler: # Do not change!
    enabled: true
